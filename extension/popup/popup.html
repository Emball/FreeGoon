<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <header>
    <span class="logo">FreeGoon</span>
    <span class="version">v4.0</span>
  </header>

  <section class="settings">
    <div class="site-row">
      <div class="site-label">
        <span class="dot" id="dot-spankbang"></span>
        SpankBang
      </div>
      <label class="toggle">
        <input type="checkbox" id="spankbang_enabled">
        <span class="slider"></span>
      </label>
    </div>
    <div class="sub-row" id="sub-spankbang">
      <span>Hover previews</span>
      <label class="toggle small">
        <input type="checkbox" id="spankbang_hover_previews">
        <span class="slider"></span>
      </label>
    </div>

    <div class="site-row" style="margin-top:8px">
      <div class="site-label">
        <span class="dot" id="dot-tnaflix"></span>
        TNAFlix
      </div>
      <label class="toggle">
        <input type="checkbox" id="tnaflix_enabled">
        <span class="slider"></span>
      </label>
    </div>
  </section>

  <div class="dir-header">
    <span>📋 Full-Length Tube Directory</span>
  </div>

  <div class="dir-meta">
    Sites ranked by: pollution → catalog → speed → quality → ads → downloads
  </div>

  <div class="directory" id="directory">
    <!-- populated by popup.js -->
  </div>

  <script src="popup.js"></script>
</body>
</html>
